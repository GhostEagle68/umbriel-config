[package]
name = "umbriel-config"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "GUI configurator for the Umbriel Wayland compositor"
license = "MIT"
repository = "https://github.com/GhostEagle68/umbriel-config"
readme = "README.md"
keywords = ["wayland", "umbriel", "configuration", "gui"]
categories = ["gui", "configuration"]

[dependencies]
anyhow = "1.0.104"
eframe = "0.36.1"
thiserror = "2.0.20"
toml_edit = "0.25.13"
wayland-client = "0.31.15"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
