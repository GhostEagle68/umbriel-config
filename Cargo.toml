[package]
name = "umbriel-config"
version = "0.2.6-beta.1"
edition = "2024"
rust-version = "1.88"
description = "GUI configurator for the Umbriel Wayland compositor"
license = "MIT"
repository = "https://github.com/GhostEagle68/umbriel-config"
readme = "README.md"
keywords = ["wayland", "umbriel", "configuration", "gui"]
categories = ["gui", "config"]

[dependencies]
anyhow = "1.0.104"
# Unpacking a release tarball over this binary (tarball installs only).
flate2 = "1.1.10"
# Offscreen GLES preview of user shader code (worker thread, pbuffer).
glow = "0.17"
khronos-egl = { version = "6", features = ["dynamic"] }
rfd = "0.15"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10"
similar = "2"
slint = "1"
tar = "0.4.46"
thiserror = "2.0.20"
toml_edit = "0.25.13"
ureq = { version = "3", features = ["json"] }
wayland-client = "0.31.15"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }

[build-dependencies]
slint-build = "1"

# Shipped-binary size: symbols stripped, cross-crate optimization on.
[profile.release]
strip = true
lto = "thin"

# Dependencies (Slint's renderer and text layout above all) build
# optimized even in dev: unoptimized they drop the editor to ~40 fps and
# make typing lag. Our own crate stays at opt-level 0 for debugging.
[profile.dev.package."*"]
opt-level = 2
