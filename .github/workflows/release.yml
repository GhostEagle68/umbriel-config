name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runs-on: ubuntu-latest
            arch: x86_64
          - runs-on: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # fontique (Slint's font stack) needs fontconfig's dev headers at
      # build time; the arm runner image doesn't preinstall them.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package release artifacts
        run: |
          mkdir -p stage/bin stage/share/licenses stage/share/applications stage/share/icons/hicolor/scalable/apps
          cp target/release/umbriel-config stage/bin/
          cp README.md LICENSE.md LICENSE-Slint.md stage/
          cp assets/fonts/LICENSE-Inter.txt stage/share/licenses/
          cp assets/fonts/LICENSE-JetBrainsMono.txt stage/share/licenses/
          cp assets/umbriel-config.desktop stage/share/applications/
          cp assets/umbriel-config.svg stage/share/icons/hicolor/scalable/apps/
          tar -czf umbriel-config-${{ matrix.arch }}-linux.tar.gz -C stage .
          sha256sum umbriel-config-${{ matrix.arch }}-linux.tar.gz > umbriel-config-${{ matrix.arch }}-linux.tar.gz.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: umbriel-config-${{ matrix.arch }}-linux
          path: |
            umbriel-config-${{ matrix.arch }}-linux.tar.gz
            umbriel-config-${{ matrix.arch }}-linux.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed so the release-notes git log can see tags
          ref: ${{ github.ref }}

      - name: Determine release channel
        id: channel
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in
            *-alpha*) CHANNEL="Alpha" ;;
            *-beta*)  CHANNEL="Beta" ;;
            *-rc*)    CHANNEL="Release Candidate" ;;
            *)        CHANNEL="Stable" ;;
          esac
          if [ "$CHANNEL" = "Stable" ]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Check the tag sits on its channel's branch
        run: |
          set -euo pipefail
          if [ "${{ steps.channel.outputs.prerelease }}" = "true" ]; then branch=dev; else branch=main; fi
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$branch" \
            || { echo "::error::$GITHUB_REF_NAME is not on $branch"; exit 1; }

      # The publish step verifies by building the packaged crate, which
      # needs fontconfig's dev headers (fontique) — same as the build job.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - name: Publish to crates.io
        # Runs on the pristine checkout — before artifacts and notes dirty
        # the tree — and before the release object exists, so a publish
        # failure can be fixed without burning the tagged version.
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Generate release notes
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v version="$VERSION" '
            /^## \[/ { keep = (index($0, "## [" version "]") == 1); next }
            keep { print }
          ' CHANGELOG.md > release_notes.md
          [ -s release_notes.md ] || echo "No notes for this version." > release_notes.md
          exclude=()
          [ "${{ steps.channel.outputs.prerelease }}" = "true" ] || exclude=(--exclude '*-*')
          PREV_TAG=$(git describe --tags --abbrev=0 "${exclude[@]}" "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            printf '\nFull diff: https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$PREV_TAG" "$GITHUB_REF_NAME" >> release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }} — ${{ steps.channel.outputs.channel }}
          prerelease: ${{ steps.channel.outputs.prerelease }}
          files: |
            umbriel-config-x86_64-linux.tar.gz
            umbriel-config-x86_64-linux.tar.gz.sha256
            umbriel-config-aarch64-linux.tar.gz
            umbriel-config-aarch64-linux.tar.gz.sha256
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
