name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runs-on: ubuntu-latest
            arch: x86_64
          - runs-on: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # fontique (Slint's font stack) needs fontconfig's dev headers at
      # build time; the arm runner image doesn't preinstall them.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package release artifacts
        run: |
          mkdir -p stage/bin stage/share/licenses stage/share/applications stage/share/icons/hicolor/scalable/apps
          cp target/release/umbriel-config stage/bin/
          cp README.md LICENSE.md LICENSE-Slint.md stage/
          cp assets/fonts/LICENSE-Inter.txt stage/share/licenses/
          cp assets/fonts/LICENSE-JetBrainsMono.txt stage/share/licenses/
          cp assets/umbriel-config.desktop stage/share/applications/
          cp assets/umbriel-config.svg stage/share/icons/hicolor/scalable/apps/
          tar -czf umbriel-config-${{ matrix.arch }}-linux.tar.gz -C stage .
          sha256sum umbriel-config-${{ matrix.arch }}-linux.tar.gz > umbriel-config-${{ matrix.arch }}-linux.tar.gz.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: umbriel-config-${{ matrix.arch }}-linux
          path: |
            umbriel-config-${{ matrix.arch }}-linux.tar.gz
            umbriel-config-${{ matrix.arch }}-linux.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed so the release-notes git log can see tags
          ref: ${{ github.ref }}

      - name: Determine release channel
        id: channel
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in
            *-alpha*) CHANNEL="Alpha" ;;
            *-beta*)  CHANNEL="Beta" ;;
            *-rc*)    CHANNEL="Release Candidate" ;;
            *)        CHANNEL="Stable" ;;
          esac
          if [ "$CHANNEL" = "Stable" ]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Publish to crates.io
        # Runs on the pristine checkout — before artifacts and notes dirty
        # the tree — and before the release object exists, so a publish
        # failure can be fixed without burning the tagged version.
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Generate release notes
        run: |
          set -euo pipefail
          # Find previous tag. Prefer the one before the current tag on the same history; fallback to the next most recent tag.
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF}^" 2>/dev/null || true)
          if [ -z "${PREV_TAG:-}" ]; then
            PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${GITHUB_REF_NAME}$" | head -n1 || true)
          fi
          if [ -z "${PREV_TAG:-}" ]; then
            RANGE="$(git rev-list --max-parents=0 HEAD)..${GITHUB_REF_NAME}"
          else
            RANGE="${PREV_TAG}..${GITHUB_REF_NAME}"
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in
            *-alpha*) CHANNEL="Alpha" ;;
            *-beta*)  CHANNEL="Beta" ;;
            *-rc*)    CHANNEL="Release Candidate" ;;
            *)        CHANNEL="Stable" ;;
          esac

          NOTES=release_notes.md
          {
            echo "# umbriel-config ${GITHUB_REF_NAME}"
            echo ""
            if [ "$CHANNEL" = "Stable" ]; then
              echo "**Channel:** Stable"
            else
              echo "**Channel:** ${CHANNEL} (pre-release — expect rough edges)"
            fi
            echo ""
          } > "$NOTES"

          # Curated, user-facing notes: the tagged version's section from
          # CHANGELOG.md (maintained per plan-changelog.md; draft with
          # `just changelog-draft`). The section header itself is dropped.
          awk -v version="$VERSION" '
            /^## \[/ { keep = (index($0, "## [" version "]") == 1) ? 1 : 0; next }
            keep { print }
          ' CHANGELOG.md > changelog_section.md
          if [ -s changelog_section.md ]; then
            cat changelog_section.md >> "$NOTES"
          else
            {
              echo "No curated notes for this version — see the full commit list below."
              echo ""
            } >> "$NOTES"
          fi
          rm -f changelog_section.md

          # The every-commit list survives, collapsed, for power users.
          {
            echo "<details>"
            echo "<summary>Full commit list since ${PREV_TAG:-the start of the project}</summary>"
            echo ""
          } >> "$NOTES"

          # Group commits by conventional-commit type; sections appear only when non-empty.
          declare -A BODIES
          while IFS=$'\x1f' read -r subject short full; do
            case "$subject" in "chore(release): "*) continue ;; esac
            section="other"
            scope=""
            text="$subject"
            if [[ "$subject" =~ ^([A-Za-z]+)(\(([A-Za-z0-9._/-]+)\))?:[[:space:]]+(.*)$ ]]; then
              type="${BASH_REMATCH[1],,}"
              scope="${BASH_REMATCH[3]:-}"
              text="${BASH_REMATCH[4]}"
              case "$type" in
                feat) section=feat ;;
                fix)  section=fix ;;
                perf|refactor) section=improve ;;
              esac
            fi
            label=""
            if [ -n "$scope" ]; then
              label="**${scope}:** "
            fi
            BODIES[$section]="${BODIES[$section]:-}- ${label}${text} ([${short}](https://github.com/${GITHUB_REPOSITORY}/commit/${full}))"$'\n'
          done < <(git log ${RANGE} --no-merges --pretty=format:"%s%x1f%h%x1f%H")

          for s in feat fix improve other; do
            case "$s" in
              feat)    title="Features" ;;
              fix)      title="Bug Fixes" ;;
              improve) title="Improvements" ;;
              other)   title="Other Changes" ;;
            esac
            body="${BODIES[$s]:-}"
            if [ -n "$body" ]; then
              {
                echo "## ${title}"
                echo ""
                printf '%s' "$body"
              } >> "$NOTES"
              echo "" >> "$NOTES"
            fi
          done

          {
            echo ""
            echo "</details>"
            echo ""
          } >> "$NOTES"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }} — ${{ steps.channel.outputs.channel }}
          prerelease: ${{ steps.channel.outputs.prerelease }}
          files: |
            umbriel-config-x86_64-linux.tar.gz
            umbriel-config-x86_64-linux.tar.gz.sha256
            umbriel-config-aarch64-linux.tar.gz
            umbriel-config-aarch64-linux.tar.gz.sha256
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
