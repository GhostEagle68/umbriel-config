name: Canary

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

# A burst of pushes builds only the newest commit.
concurrency:
  group: canary
  cancel-in-progress: true

env:
  TAG: canary

jobs:
  build:
    strategy:
      matrix:
        include:
          - runs-on: ubuntu-latest
            arch: x86_64
          - runs-on: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Dependencies rarely change between pushes; only our crate rebuilds.
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - name: Build release binary
        run: cargo build --release --locked
        env:
          # The update check compares this with the canary tag's commit.
          UMBRIEL_CONFIG_BUILD_SHA: ${{ github.sha }}
      - name: Package release artifacts
        run: |
          # One top-level folder, so extracting leaves a tidy directory
          # to cd into instead of scattering bin/ and share/ into $PWD.
          stage=umbriel-config-${{ matrix.arch }}-linux
          mkdir -p $stage/bin $stage/share/licenses $stage/share/applications $stage/share/icons/hicolor/scalable/apps
          cp target/release/umbriel-config $stage/bin/
          cp README.md LICENSE.md LICENSE-Slint.md $stage/
          cp assets/fonts/LICENSE-Inter.txt $stage/share/licenses/
          cp assets/fonts/LICENSE-JetBrainsMono.txt $stage/share/licenses/
          cp assets/umbriel-config.desktop $stage/share/applications/
          cp assets/umbriel-config.svg $stage/share/icons/hicolor/scalable/apps/
          # Extract-then-run-this, so the download isn't a puzzle.
          install -m755 packaging/install.sh $stage/install.sh
          cp packaging/INSTALL.txt $stage/
          tar -czf $stage.tar.gz $stage
          sha256sum $stage.tar.gz > $stage.tar.gz.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: umbriel-config-${{ matrix.arch }}-linux
          path: |
            umbriel-config-${{ matrix.arch }}-linux.tar.gz
            umbriel-config-${{ matrix.arch }}-linux.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the notes list commits since the last v* tag
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Replace the canary release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          since=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          {
            echo "Untested build of \`${GITHUB_SHA::7}\` from dev. Times are UTC."
            echo
            # Grouped like CHANGELOG.md (cliff.toml); CLIFF_CANARY adds each
            # entry's date (UTC) and short sha. The commits line lists every
            # commit newest first, so the app can drop the entries a
            # user's build already has. Capped, with a link to the rest.
            range=${since:+"$since"..}HEAD
            total=$(git rev-list --no-merges --count $range)
            cliff_range=$range
            if [ "$total" -gt 30 ]; then
              cliff_range="$(git rev-list --no-merges -n 30 $range | tail -n 1)^..HEAD"
            fi
            echo "<!-- commits: $(git rev-list $range | cut -c1-7 | paste -sd ' ') -->"
            CLIFF_CANARY=1 git cliff --strip header "$cliff_range" |
              sed '/^## \[Unreleased\]/d'
            if [ "$total" -gt 30 ]; then
              echo
              echo "…and $((total - 30)) earlier ([all changes since ${since:-the start}](https://github.com/${GITHUB_REPOSITORY}/compare/${since:-$(git rev-list --max-parents=0 HEAD | tail -n 1)}...${GITHUB_SHA}))."
            fi
            # Last on purpose: the app stops reading here, so people
            # already on canary never see this part.
            echo
            echo "## Install"
            echo
            echo "Install this build in one command:"
            echo
            echo '```sh'
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/dev/packaging/get.sh | sh -s -- --canary"
            echo '```'
            echo
            echo "Or download the tarball for your machine below (\`x86_64\` for most PCs,"
            echo "\`aarch64\` for ARM), then:"
            echo
            echo '```sh'
            echo "tar -xzf umbriel-config-x86_64-linux.tar.gz"
            echo "cd umbriel-config-x86_64-linux"
            echo "./install.sh"
            echo '```'
            echo
            echo "Already have umbriel-config? Pick **Canary** in **Settings → Updates**."
          } > notes.md
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
            --title "$TAG ${GITHUB_SHA::7}" --notes-file notes.md \
            umbriel-config-*-linux.tar.gz umbriel-config-*-linux.tar.gz.sha256