name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Cancel in-progress runs for the same branch/PR when new commits land.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libinput10 libgbm1 libxkbcommon0

      # Prebuilt formatter from Slint's release, pinned to the version the
      # .slint files are formatted with (local: slint-lsp --version);
      # building it from source took ~8 minutes.
      - name: Install slint-lsp
        run: |
          curl -fsSL https://github.com/slint-ui/slint/releases/download/v1.17.1/slint-lsp-linux.tar.gz \
            | tar xz -C "$HOME"
          echo "$HOME/slint-lsp" >> "$GITHUB_PATH"

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: just format-check

      - name: Lint
        run: just lint

      - name: Test
        run: just test
