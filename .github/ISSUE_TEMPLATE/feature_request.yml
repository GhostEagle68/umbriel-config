name: Feature Request
description: Suggest an improvement, new feature, or enhancement for umbriel-config
title: "[FEATURE] "
labels: ["feature"]

body:
  - type: checkboxes
    id: submission-checklist
    attributes:
      label: Submission checklist
      description: Please confirm the following before submitting.
      options:
        - label: I have searched existing issues and confirmed this has not been requested before.
          required: true
        - label: I have checked existing pull requests for similar changes.
          required: true

  - type: dropdown
    id: feature-type
    attributes:
      label: Feature type
      description: What kind of feature or improvement is this?
      options:
        - New settings page or editor
        - Improvement to an existing page
        - CLI improvement
        - Packaging / installation
        - Documentation improvement
        - Other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Feature summary
      description: A concise description of the feature or enhancement.
      placeholder: What would you like to see added or changed?
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation / use case
      description: |
        Why would this feature be useful?
        What problem does it solve or improve?
      placeholder: Explain the benefit or real-world use case...
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: |
        Describe how you think this could work.

        Mockups, examples, screenshots, or references are welcome.
      placeholder: Describe your idea...
    validations:
      required: true

  - type: checkboxes
    id: upstream
    attributes:
      label: Umbriel-side change needed?
      description: |
        Tick if this needs umbriel itself to change (a new config key, action,
        or IPC command). Those features also belong on the
        [umbriel](https://github.com/noctalia-dev/umbriel) tracker — note it
        here anyway so the GUI side can track readiness.
      options:
        - label: This needs a change in umbriel itself

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you considered any alternative solutions or workarounds?
      placeholder: Optional...

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any additional information, screenshots, mockups, or context here.
