[changelog]
header = "# Changelog\n"
body = """
{% macro entry(commit) %}{% set note = commit.footers | default(value=[]) | filter(attribute="token", value="Changelog") | first %}{% set nv = "" %}{% if note %}{% set nv = note.value | trim %}{% endif %}
- {% if nv != "" and nv != "short" %}{{ note.value }}{% else %}{{ commit.message | split(pat="\n") | first | trim | upper_first }}{% endif %}{% if commit.breaking and commit.breaking_description and commit.breaking_description != commit.message %} — {{ commit.breaking_description }}{% endif %}
{%- if commit.body and nv == "" %}
{{ commit.body | trim | indent(prefix="  ", first=true) }}
{%- endif %}
{%- endmacro entry %}
{% if version %}## [{{ version | trim_start_matches(pat="v") }}] — {{ now() | date(format="%Y-%m-%d") }}{% else %}## [Unreleased]{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{# One sub-heading per area (the commit scope), unscoped last. #}
{% for scope, scoped in commits | group_by(attribute="scope") %}
#### {% if scope == "ui" %}UI{% else %}{{ scope | upper_first }}{% endif %}
{% for commit in scoped %}{{ self::entry(commit=commit) }}{% endfor %}
{% endfor %}
{%- set_global general = false %}
{%- for commit in commits %}{% if not commit.scope %}{% if not general %}
#### General
{% set_global general = true %}{% endif %}{{ self::entry(commit=commit) }}{% endif %}{% endfor %}
{% endfor %}"""
footer = ""
trim = false
postprocessors = [{ pattern = "\n{3,}", replace = "\n\n" }]

[git]
conventional_commits = true
filter_unconventional = false
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
# `eat(ui):` happened once; a typo'd prefix should still reach its section.
commit_preprocessors = [{ pattern = "^eat\\(", replace = "feat(" }]
commit_parsers = [
  # `Changelog: skip` in a commit footer keeps it out of the changelog.
  # Matching is a substring over the footer value, so avoid the word
  # "skip" inside a `Changelog:` note you do want published.
  { footer = "skip", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^[a-z]+\\(deps\\)", skip = true },
  { message = "^(chore|ci|docs|refactor|test|build|style)", skip = true },
  # The release/CI plumbing is ours, never the user's.
  { message = "^[a-z]+\\((release|ci)\\)", skip = true },
  # Breaking and security come before the plain feat/fix rules, which
  # would otherwise swallow them; first match wins. The `breaking` field
  # covers both spellings — a `!` in the subject and a BREAKING CHANGE
  # footer — where a message regex would only catch the first.
  { field = "breaking", pattern = "true", group = "<!-- 0 -->💥 Breaking" },
  { message = "^(security|fix\\(security\\))", group = "<!-- 1 -->🔒 Security" },
  { message = "^feat", group = "<!-- 2 -->🚀 Features" },
  { message = "^fix", group = "<!-- 3 -->🐛 Fixed" },
  { message = "^perf", group = "<!-- 4 -->⚡ Performance" },
  { message = "^revert", group = "<!-- 5 -->🔁 Changed" },
  { message = ".*", group = "<!-- 6 -->📦 Other" },
]