[changelog]
header = "# Changelog\n"
body = """
## [{{ version | trim_start_matches(pat="v") }}] — {{ now() | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }}
{%- endfor %}

{% endfor %}"""
footer = ""
trim = false
postprocessors = [{ pattern = "\n{3,}", replace = "\n\n" }]

[git]
conventional_commits = true
filter_unconventional = false
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^[a-z]+\\(deps\\)", skip = true },
  { message = "^(chore|ci|docs|refactor|test|build|style)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Changed" },
  { message = ".*", group = "<!-- 3 -->Other" },
]
